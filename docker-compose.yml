services:
  payment-service:
    image: ktshonln/payment-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    networks:
      - katisha-net
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - db
      - pgbouncer
      - rabbitmq
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  katisha-net:
    external: true
