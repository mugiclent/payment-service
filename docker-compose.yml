services:
  payment-svc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME}/payment-service:${IMAGE_TAG:-latest}
    container_name: payment-svc
    restart: unless-stopped
    networks:
      - katisha-net
    environment:
      NODE_ENV:                  ${NODE_ENV}
      PORT:                      ${PORT:-8099}
      DB_USER:                   ${DB_USER}
      DB_NAME:                   ${DB_NAME}
      DB_PASSWORD:               ${DB_PASSWORD}
      RABBITMQ_USER:             ${RABBITMQ_USER}
      RABBITMQ_PASSWORD:         ${RABBITMQ_PASSWORD}
      REDIS_PASSWORD:            ${REDIS_PASSWORD}
      IMMUDB_HOST:               immudb
      IMMUDB_PORT:               3322
      IMMUDB_USER:               ${IMMUDB_USER}
      IMMUDB_PASSWORD:           ${IMMUDB_PASSWORD}
      IMMUDB_DATABASE:           ${IMMUDB_DATABASE:-defaultdb}
      FDI_BASE_URL:              ${FDI_BASE_URL}
      FDI_APP_ID:                ${FDI_APP_ID}
      FDI_SECRET:                ${FDI_SECRET}
      FDI_WALLET_ID:             ${FDI_WALLET_ID}
      FDI_MTN_CHANNEL_ID:        ${FDI_MTN_CHANNEL_ID}
      FDI_AIRTEL_CHANNEL_ID:     ${FDI_AIRTEL_CHANNEL_ID}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL}
      PLATFORM_FEE_BASIS_POINTS: ${PLATFORM_FEE_BASIS_POINTS}
      GATEWAY_FEE_BASIS_POINTS:  ${GATEWAY_FEE_BASIS_POINTS}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8099/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  immudb:
    image: codenotary/immudb:1.11.0
    container_name: immudb
    restart: unless-stopped
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_PASSWORD}
    volumes:
      - immudb_data:/var/lib/immudb
    networks:
      - katisha-net
    healthcheck:
      test: ["CMD", "immuadmin", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  immudb_data:
    name: payment_immudb_data

networks:
  katisha-net:
    external: true
