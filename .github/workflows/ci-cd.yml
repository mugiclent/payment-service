name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/payment-svc
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: npx vitest run --passWithNoTests

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          SHA_TAG=sha-${{ github.sha }}
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"

            DEPLOY_DIR="$HOME/katisha/payment-svc"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git pull origin main
            else
              mkdir -p "$HOME/katisha"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            # Minimal .env — only vars needed for docker compose image resolution.
            # All app secrets come from Infisical.
            cat > .env <<ENVEOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            ENVEOF

            INFISICAL_TOKEN=$(infisical login \
              --method=universal-auth \
              --client-id=${{ secrets.INFISICAL_CLIENT_ID }} \
              --client-secret=${{ secrets.INFISICAL_CLIENT_SECRET }} \
              --domain=http://localhost:8080 \
              --plain --silent)

            get_secret() {
              infisical secrets get "$1" \
                --token="$INFISICAL_TOKEN" \
                --projectId=${{ secrets.INFISICAL_PROJECT_ID }} \
                --env=dev \
                --path=/payment-svc \
                --domain=http://localhost:8080 \
                --plain 2>/dev/null
            }

            DB_USER=$(get_secret DB_USER)
            DB_NAME=$(get_secret DB_NAME)
            DB_PASSWORD=$(get_secret DB_PASSWORD)
            IMMUDB_PASSWORD=$(get_secret IMMUDB_PASSWORD)
            IMMUDB_DATABASE=$(get_secret IMMUDB_DATABASE)
            DIRECT_DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"

            # Create the immudb database if it doesn't exist yet.
            docker exec immudb immuadmin login immudb \
              --password "$IMMUDB_PASSWORD" \
              --tokenfile /tmp/immu-deploy.token 2>/dev/null || true
            docker exec immudb immuadmin database create "$IMMUDB_DATABASE" \
              --tokenfile /tmp/immu-deploy.token 2>/dev/null || true

            # If the Transaction table doesn't exist, the DB is uninitialized.
            # Wipe _prisma_migrations so migrate deploy starts from scratch.
            # No-ops once tables are in place — safe on every subsequent deploy.
            docker exec db psql -U "$DB_USER" -d "$DB_NAME" -c "
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'Transaction'
                ) AND EXISTS (
                  SELECT FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = '_prisma_migrations'
                ) THEN
                  DELETE FROM _prisma_migrations;
                END IF;
              END \$\$;
            " 2>/dev/null || true

            docker run --rm \
              --network katisha-net \
              -e DIRECT_DATABASE_URL="$DIRECT_DATABASE_URL" \
              ${{ secrets.DOCKER_USERNAME }}/payment-svc:${{ needs.build-and-push.outputs.image_tag }} \
              npm run db:deploy

            infisical run \
              --token="$INFISICAL_TOKEN" \
              --projectId=${{ secrets.INFISICAL_PROJECT_ID }} \
              --env=dev \
              --path=/payment-svc \
              --domain=http://localhost:8080 \
              -- docker compose up -d --no-deps --pull always immudb payment-svc

            echo "Waiting for payment-svc to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' payment-svc 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && break
              [ $i -eq 30 ] && echo "Timed out waiting for payment-svc" && exit 1
              sleep 3
            done

            echo "payment-svc is up."
